name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # 网页资源不进公开仓库：构建时从服务器经 CF 隧道拉取（token 走 Secrets）
      - name: Fetch web assets
        run: |
          mkdir -p ios/AionIOS/WebAssets
          curl -sSfvL --retry 3 --retry-delay 5 \
            -H "X-Aion-Token: ${{ secrets.AION_TUNNEL_TOKEN }}" \
            -H "User-Agent: Mozilla/5.0 (AionWebAssetsCI)" \
            -H "Accept: */*" \
            https://api-5d158ee9.kuriyu.love/static/web-assets-pack.zip \
            -o web-assets-pack.zip
          unzip -q web-assets-pack.zip -d ios/AionIOS/WebAssets
          ls ios/AionIOS/WebAssets | head -5

      - name: Inspect DeviceActivity SDK interface (verify init API)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          MOD="$SDK/System/Library/Frameworks/DeviceActivity.framework/Modules/DeviceActivity.swiftmodule"
          echo "=== swiftmodule dir ==="
          ls -la "$MOD" || echo "NO swiftmodule dir"
          echo "=== DeviceActivityResults mentions ==="
          grep -n "DeviceActivityResults" "$MOD"/*.swiftinterface | head -20 || echo "NO DeviceActivityResults"
          echo "=== init(context mentions ==="
          grep -n "init(context" "$MOD"/*.swiftinterface | head -10 || echo "NO init(context"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive (unsigned)
        working-directory: ios
        run: |
          xcodebuild archive \
            -project AionIOS.xcodeproj \
            -scheme AionIOS \
            -configuration Release \
            -archivePath build/AionIOS \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        working-directory: ios
        run: |
          APP="build/AionIOS.xcarchive/Products/Applications/AionIOS.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          chmod -R 755 Payload
          zip -qr AionIOS-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AionIOS-unsigned
          path: ios/AionIOS-unsigned.ipa
          retention-days: 30

  build-signed:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # 网页资源不进公开仓库：构建时从服务器经 CF 隧道拉取（token 走 Secrets）
      - name: Fetch web assets
        run: |
          mkdir -p ios/AionIOS/WebAssets
          curl -sSfvL --retry 3 --retry-delay 5 \
            -H "X-Aion-Token: ${{ secrets.AION_TUNNEL_TOKEN }}" \
            -H "User-Agent: Mozilla/5.0 (AionWebAssetsCI)" \
            -H "Accept: */*" \
            https://api-5d158ee9.kuriyu.love/static/web-assets-pack.zip \
            -o web-assets-pack.zip
          unzip -q web-assets-pack.zip -d ios/AionIOS/WebAssets
          ls ios/AionIOS/WebAssets | head -5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # 2026-08-25 仓库转公开脱敏：签名材料全部走 Secrets，仓库不再落任何凭证
      - name: Setup signing keychain
        env:
          AION_P12_B64: ${{ secrets.AION_P12_B64 }}
          AION_DEV_PROFILE_B64: ${{ secrets.AION_DEV_PROFILE_B64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          echo "$AION_P12_B64" | base64 -d -i - -o build.p12
          echo "$AION_DEV_PROFILE_B64" | base64 -d -i - -o build.mobileprovision
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import build.p12 -P "$P12_PASSWORD" -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp build.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Archive (signed)
        working-directory: ios
        run: |
          # MonitorExtension target 已从工程移除（B3 已死 + profile 未随证书轮换更新）
          # AION_TUNNEL_TOKEN 前缀 = 构建设置 → Info.plist $(AION_TUNNEL_TOKEN) 展开
          AION_TUNNEL_TOKEN="${{ secrets.AION_TUNNEL_TOKEN }}" xcodebuild archive \
            -project AionIOS.xcodeproj \
            -scheme AionIOS \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/AionIOS-signed \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=2ZSUTQ62K8 \
            CODE_SIGN_IDENTITY="Apple Development"

      - name: Package IPA
        working-directory: ios
        run: |
          APP="build/AionIOS-signed.xcarchive/Products/Applications/AionIOS.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          chmod -R 755 Payload
          zip -qr AionIOS-signed.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AionIOS-signed
          path: ios/AionIOS-signed.ipa
          retention-days: 30
